services:
  - type: web
    name: relaytag-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: relaytag-db
          property: connectionString
      - key: VITE_COMETCHAT_APP_ID
        sync: false
      - key: VITE_COMETCHAT_REGION
        sync: false
      - key: VITE_COMETCHAT_SERVER_AUTH
        value: 'true'
      - key: COMETCHAT_APP_ID
        sync: false
      - key: COMETCHAT_REGION
        sync: false
      - key: COMETCHAT_REST_API_KEY
        sync: false
databases:
  - name: relaytag-db
    plan: free
    databaseName: relaytag
    user: relaytag
